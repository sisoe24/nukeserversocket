name: NukeServerSocket

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-mac-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 3.10 installs PySide2, 3.11 installs PySide6 (see pyproject.toml)
        os: [macos-15, windows-latest]
        python-version: ["3.10", "3.11"]
        exclude:
          # PySide2 5.15 has no macOS arm64 wheels
          - os: macos-15
            python-version: "3.10"
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install tox
      - name: Run tox
        run: tox -e py

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install Qt and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt5gui5 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Run tests with xvfb
        run: |
          xvfb-run --auto-servernum python -m poetry run pytest
